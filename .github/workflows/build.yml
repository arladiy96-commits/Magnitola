name: Build GAZ Speedometer POCO + Android 7 tablet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "app/**"
      - "build.gradle"
      - "settings.gradle"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android platform and build tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile both APK variants
        run: gradle --no-daemon :app:assemblePocoDebug :app:assembleTabletDebug
      - name: Upload POCO APK
        uses: actions/upload-artifact@v4
        with:
          name: GAZ-Speedometer-POCO-Android8plus
          path: app/build/outputs/apk/poco/debug/app-poco-debug.apk
          if-no-files-found: error
      - name: Upload Android 7 tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: GAZ-Speedometer-Tablet-Android7
          path: app/build/outputs/apk/tablet/debug/app-tablet-debug.apk
          if-no-files-found: error

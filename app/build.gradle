plugins {
    id 'com.android.application'
}
android {
    namespace 'com.example.autolinkprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.autolinkprobe'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3-native-autolink'
    }
}
dependencies {
    // Map rendered only onto our private AutoLink virtual display.
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
